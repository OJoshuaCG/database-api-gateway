services:

  # ── MariaDB (BD de metadatos del gateway) ────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS es requerido en el entorno}
      MARIADB_DATABASE:      ${DB_NAME:?DB_NAME es requerido en el entorno}
      MARIADB_USER:          ${DB_USER:?DB_USER es requerido en el entorno}
      MARIADB_PASSWORD:      ${DB_PASS:?DB_PASS es requerido en el entorno}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Valkey ────────────────────────────────────────────────────────────────────
  # Backend del rate limiting (SlowAPI) compartido entre workers/réplicas. Valkey es
  # el fork OSI (BSD-3) de Redis, wire-compatible: el cliente `redis` y el esquema
  # `redis://` funcionan sin cambios de código. Solo contadores efímeros: sin
  # persistencia (save off, appendonly no).
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  # Sin `ports:` publicados: Dokploy enruta tráfico externo vía su propio Traefik
  # directo al puerto interno 8000 (configurado desde la pestaña "Domains" del
  # panel). No hay nginx/Certbot en este archivo: Dokploy ya ocupa 80/443 del host
  # y gestiona TLS (Let's Encrypt) por su cuenta — ver docs/dokploy-deployment.md.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    # Carga variables del archivo .env si existe (no falla si no existe). En Dokploy
    # las variables se definen en la pestaña "Environment" del proyecto, que Dokploy
    # inyecta al entorno del contenedor sin necesidad de este archivo.
    env_file:
      - path: .env
        required: false
    environment:
      # Estas variables se sobrescriben siempre, independiente del entorno externo,
      # para garantizar que la app use los servicios de este mismo compose.
      DB_ENGINE: mysql+pymysql
      DB_HOST: db
      RATE_LIMIT_REDIS_ENABLED: "True"
      RATE_LIMIT_REDIS_URL: redis://valkey:6379
    volumes:
      - uploads_data:/app/uploads
      # Artefactos de exportación. Volumen PROPIO y no el de uploads: aquel es un
      # buzón de entrada sin TTL, y estos son archivos con los datos del origen en
      # claro que se purgan por retención (EXPORT_ARTIFACT_TTL_MINUTES).
      - exports_data:/app/exports
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # Alias ESTABLE en la red de Dokploy, para que otros contenedores puedan alcanzar este
    # servicio sin depender del nombre que Dokploy genera.
    #
    # Sin esto, la única referencia es el nombre del contenedor de compose
    # (`<app>-<hash>-api-1`), donde el hash lo asigna Dokploy **al crear la aplicación**. Ese
    # hash sobrevive a los deploys, pero NO a borrar y recrear la app en el panel — y el día que
    # eso pase, quien apunte a ese nombre se queda sin backend con un 502 que no explica por qué.
    # El alias lo elegimos nosotros y vive en este archivo, así que no depende de nada externo.
    #
    # Quien lo consume hoy: el proxy del contenedor del frontend, que sirve la API bajo el mismo
    # origen que la SPA porque la cookie de CSRF es host-only y desde otro host el JS no puede
    # leerla. Ver `database-api-gateway-frontend/docs/dokploy.md` §3.
    #
    # `default` se declara explícitamente porque al listar `networks` el servicio deja de unirse
    # sola a la red por defecto del compose, y la necesita para alcanzar a `db` y a `valkey` por
    # sus nombres de servicio.
    networks:
      default: {}
      dokploy-network:
        aliases:
          - gateway-api

# `dokploy-network` la crea Dokploy, no este compose: acá sólo se declara para poder colgarle el
# alias de arriba. `db` y `valkey` NO se unen a ella — siguen sólo en la red interna del compose,
# que es lo que los mantiene sin alcance desde el resto de la instancia.
networks:
  dokploy-network:
    external: true

volumes:
  mariadb_data:   # Datos persistentes de la BD de metadatos (MariaDB)
  uploads_data:   # Archivos subidos por la aplicación
  exports_data:   # Artefactos de exportación (efímeros: TTL corto + purga)
