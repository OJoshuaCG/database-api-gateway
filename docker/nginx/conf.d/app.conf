# Upstream apuntando al servicio 'api' de Docker Compose (puerto interno 8000)
upstream fastapi_backend {
    server api:8000;
    keepalive 32;
}

# ── HTTP (puerto 80) ──────────────────────────────────────────────────────────
# En producción con SSL, descomentar el redirect y comentar el bloque location /
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # Directivas de proxy a nivel `server` y NO dentro de cada `location`: un `location ~`
    # no hereda de `location /` (son hermanos), pero ambos heredan de `server`. Duplicarlas
    # en los dos bloques es exactamente como se desincronizan. `proxy_pass` no se puede
    # declarar acá, por eso es lo único que se repite.
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    proxy_connect_timeout  60s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    proxy_buffering    on;
    proxy_buffer_size  4k;
    proxy_buffers      8 4k;

    # Necesario para la verificación ACME de Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Rutas síncronas largas: 3600s ────────────────────────────────────────
    # Este archivo es SOLO para el entorno local: en producción (Dokploy) no hay este nginx
    # y el timeout vive en el nginx del frontend (ver docs/dokploy-deployment.md). Se
    # mantiene alineado para que local se comporte como producción.
    #
    # Estas 6 rutas ejecutan DDL del usuario de forma SÍNCRONA con el timeout de volcado
    # del backend (REMOTE_BULK_STATEMENT_TIMEOUT_MS, 1 h). Con 60s nginx devolvía 504 al
    # cliente mientras el backend seguía aplicando: el operador veía un error de algo que
    # en realidad terminaba bien. El resto conserva 60s a propósito.
    #
    # - El `$` final es obligatorio: sin él `/execute` también matchearía `/execute-preview`.
    # - `proxy_read_timeout` no acepta variables, por eso es un `location` propio y no un
    #   `map`. `send_timeout` no aplica: mientras el backend trabaja no se escribe nada al
    #   cliente, así que no hay pausa entre escrituras que medir.
    # - La regex no filtra por método; en esas rutas solo existe POST.
    location ~ ^/api/v1/(managed-databases/[0-9]+/migrations/(apply|rollback|reconcile-partial)|database-models/[0-9]+/migrations/apply-all|schema-comparisons/[0-9]+/(adopt|execute))$ {
        proxy_pass          http://fastapi_backend;
        proxy_read_timeout  3600s;
    }

    # ── Opción A: HTTP directo (sin SSL) ─────────────────────────────────────
    # Usar cuando no hay certificado SSL configurado todavía.
    # Si se activa la Opción B, comentar también el `location ~` de rutas largas.
    location / {
        proxy_pass          http://fastapi_backend;
    }

    # ── Opción B: Redirigir a HTTPS (activar después de obtener certificado) ──
    # Comentar el bloque "Opción A" y descomentar la siguiente línea:
    # return 301 https://$host$request_uri;
}


# ── HTTPS (puerto 443) ────────────────────────────────────────────────────────
# Descomentar todo este bloque cuando tengas un certificado SSL.
#
# Pasos para habilitar HTTPS con Certbot:
#   1. Asegúrate de que el dominio apunta a este servidor.
#   2. Instala Certbot en el host: sudo apt install certbot
#   3. Obtén el certificado (con Nginx detenido o con webroot):
#        certbot certonly --webroot -w /var/lib/docker/volumes/<proyecto>_certbot_www/_data -d tudominio.com
#   4. Actualiza 'server_name' y las rutas de ssl_certificate más abajo.
#   5. Descomentar este bloque y recargar Nginx: docker compose exec nginx nginx -s reload
#   6. En el bloque HTTP de arriba, reemplaza el location / por: return 301 https://$host$request_uri;
